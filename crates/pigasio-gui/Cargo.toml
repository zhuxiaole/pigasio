[package]
name = "pigasio-gui"
description = "PigASIO 的多设备控制面板"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pigasio-gui"
path = "src/main.rs"

[dependencies]
pigasio-core = { workspace = true }
log = { workspace = true }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
toml = { workspace = true }
toml_edit = { workspace = true }
# 界面偏好(主题)单独存一份,见 `UiPrefs` 的说明。
serde = { workspace = true }
egui_extras = { version = "0.29", default-features = false }

[build-dependencies]
# 把 assets/pigasio.ico 编进 exe 的 Windows 资源(见 build.rs)。
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# 用来在启动失败时弹一个系统对话框 —— 发布版没有控制台,
# 否则用户只能看到"双击没反应"。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Graphics_Dwm"] }
